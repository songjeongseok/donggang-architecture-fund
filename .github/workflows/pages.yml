name: Validate and optionally publish Pages

# No push, pull_request, schedule or tag event deploys this project.
# Merely adding this workflow does not run it.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: '실제 공개 배포. 검증만 하려면 체크하지 마세요.'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: pages-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Require default branch for publication
        env:
          PUBLISH: ${{ inputs.publish }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$PUBLISH" = "true" ] && [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo 'Publication is allowed only from the default branch.' >&2
            exit 1
          fi
      - name: Validate and build static output
        run: python3 scripts/build.py
      - name: Upload candidate (does not publish)
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: ${{ inputs.publish == true && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Read existing Pages configuration
        uses: actions/configure-pages@v5
        with:
          enablement: false
      - name: Publish approved candidate
        id: deployment
        uses: actions/deploy-pages@v4
